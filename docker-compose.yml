services:
  # ============================================================================
  # 1. PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: authory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-authory}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authory"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - authory-network

  # ============================================================================
  # 2. Redis Distributed Cache & Coordination (Redisson)
  # ============================================================================
  redis:
    image: redis:7.4-alpine
    container_name: authory-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - authory-network

  # ============================================================================
  # 3. Jaeger Distributed Tracing
  # ============================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: authory-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    networks:
      - authory-network

  # ============================================================================
  # 4. Prometheus Metrics Collection
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: authory-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - authory-network

  # ============================================================================
  # 5. Grafana Loki (Centralized Log Aggregation)
  # ============================================================================
  loki:
    image: grafana/loki:3.1.1
    container_name: authory-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./docker/observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - authory-network

  # ============================================================================
  # 6. Promtail Log Shipper (Tails App Logs & Ships to Loki)
  # ============================================================================
  promtail:
    image: grafana/promtail:3.1.1
    container_name: authory-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./docker/observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/authory:ro
    depends_on:
      - loki
    networks:
      - authory-network

  # ============================================================================
  # 7. Grafana Dashboard (Metrics, Logs, and Distributed Tracing Visualization)
  # ============================================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: authory-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - jaeger
    networks:
      - authory-network

  # ============================================================================
  # 8. Authory Service (Spring Boot 4.1.2 & Java 25)
  # ============================================================================
  authory-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXUS_URL: ${NEXUS_URL:-http://host.docker.internal:8081/repository/maven-public/}
        NEXUS_USERNAME: ${NEXUS_USERNAME:-admin}
        NEXUS_PASSWORD: ${NEXUS_PASSWORD:-admin123}
      extra_hosts:
        - "host.docker.internal:host-gateway"
    container_name: authory-service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SERVER_PORT:-8600}:8600"
    environment:
      # Server & Virtual Threads Configuration
      - SERVER_PORT=8600
      - SPRING_THREADS_VIRTUAL_ENABLED=true

      # PostgreSQL Database Connection & Flyway Schemas
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/authory
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}

      # Redis Cache & Token Blacklist
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0

      # Security & JWT Tokens
      - AUTHORY_SECURITY_TOKEN_SECRET_KEY=${JWT_SECRET_KEY:-q8N2f2j+V2xYcD1N8b9J7E3lH1x+YkL4Bf7Zq2VxG+Q=}
      - AUTHORY_SECURITY_TOKEN_ACCESS_TOKEN_EXPIRATION=${ACCESS_TOKEN_EXPIRATION:-3600000}
      - AUTHORY_SECURITY_TOKEN_REFRESH_TOKEN_EXPIRATION=${REFRESH_TOKEN_EXPIRATION:-604800000}

      # Distributed Tracing via OpenTelemetry / Jaeger
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://jaeger:4318/v1/traces

    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - authory-network

# ==============================================================================
# Persistent Volumes & Network Definitions
# ==============================================================================
volumes:
  postgres-data:
    name: authory-postgres-data
  redis-data:
    name: authory-redis-data
  prometheus-data:
    name: authory-prometheus-data
  loki-data:
    name: authory-loki-data
  grafana-data:
    name: authory-grafana-data

networks:
  authory-network:
    name: authory-network
    driver: bridge
