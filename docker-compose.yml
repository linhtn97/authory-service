  # Application Service
  authory-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authory-service
    restart: unless-stopped
    ports:
      - "8600:8600"
    environment:
      # Override the DB URL to use the docker network service name instead of localhost
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/authory
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
