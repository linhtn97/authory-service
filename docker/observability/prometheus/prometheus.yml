global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "authory-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["authory-service:8600", "host.docker.internal:8600"]
        labels:
          application: "authory-service"
          env: "local"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
