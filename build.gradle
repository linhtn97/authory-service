plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.spotless)
}

group = 'com.linhtn'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'Nexus'
        url = uri(System.getenv('NEXUS_URL') ?: (findProperty('nexusUrl') ?: 'http://localhost:8081/repository/maven-public/'))
        allowInsecureProtocol = true
        credentials {
            username = System.getenv('NEXUS_USERNAME') ?: (findProperty('nexusUsername') ?: 'admin')
            password = System.getenv('NEXUS_PASSWORD') ?: (findProperty('nexusPassword') ?: 'admin123')
        }
    }
}

dependencies {
    implementation libs.spring.boot.starter.data.jpa
    implementation libs.spring.boot.starter.security
    implementation libs.spring.boot.starter.validation
    implementation libs.spring.boot.starter.webflux
    implementation libs.spring.boot.starter.webmvc
    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.boot.starter.cache
    implementation libs.spring.boot.starter.data.redis
    implementation libs.spring.aop
    implementation libs.aspectj.weaver

    // Platform Shared Modules (be-platform from mavenLocal)
    implementation libs.bundles.platform

    // Database Migration Bundle
    implementation libs.bundles.flyway

    // Observability, Tracing & Metrics Bundle
    implementation libs.bundles.observability

    // OpenAPI 3 / Swagger UI
    implementation libs.springdoc.openapi

    // Lombok & MapStruct
    compileOnly libs.lombok
    annotationProcessor libs.lombok
    annotationProcessor libs.lombok.mapstruct.binding
    implementation libs.mapstruct
    annotationProcessor libs.mapstruct.processor

    // JWT Provider
    implementation libs.jjwt.api
    runtimeOnly libs.jjwt.impl
    runtimeOnly libs.jjwt.jackson

    // Jackson
    implementation libs.jackson.databind

    // Redisson
    implementation libs.redisson

    runtimeOnly libs.postgresql

    testImplementation libs.spring.boot.starter.data.jpa.test
    testImplementation libs.spring.boot.starter.security.test
    testImplementation libs.spring.boot.starter.validation.test
    testImplementation libs.spring.boot.starter.webflux.test
    testImplementation libs.spring.boot.starter.webmvc.test
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('test') {
    useJUnitPlatform()
}

spotless {
    java {
        target 'src/**/*.java'

        // Use Google Java Format (industry standard)
        googleJavaFormat('1.35.0')
                .aosp() // optional: slightly different wrapping (more compact)

        // Remove unused imports
        removeUnusedImports()

        // Import order (very important for large teams)
        importOrder(
                'java',
                'javax',
                'jakarta',
                'org',
                'com',
                '' // static imports last
        )

        // Ensure newline at end of file
        endWithNewline()

        // Trim trailing whitespace
        trimTrailingWhitespace()
    }
}