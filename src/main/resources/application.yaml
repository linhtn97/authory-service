server:
  port: ${SERVER_PORT:8600}
  shutdown: graceful

spring:
  main:
    allow-bean-definition-overriding: true
  threads:
    virtual:
      enabled: true
  application:
    name: authory-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authory}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maxLifetime: 1800000
      connectionTimeout: 30000
      minimumIdle: 5
      idleTimeout: 600000
      maximumPoolSize: 20
      leakDetectionThreshold: 5000
      pool-name: AuthoryHikariPool
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    schemas: public, auth, organization, rbac, abac
    locations: classpath:db/migration
  cache:
    type: simple
    cache-names:
      - user-authorities
      - user-principals
      - abac-attributes
      - user-attributes

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0 # 1.0 = sample 100% of requests (ideal for local/dev)
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  file:
    name: ${LOG_FILE:logs/authory.log}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}] %pid --- [%t] %-40.40logger{39} : %m%n"

# Enterprise Platform Configurations (be-platform)
platform:
  # 1. Web Core & i18n (platform-web-core)
  web:
    i18n:
      enabled: true
      default-locale: en
      supported-locales:
        - en
        - vi
      base-names:
        - classpath:i18n/messages
        - classpath:messages
      cache-seconds: 3600
      encoding: UTF-8
      fallback-to-system-locale: false
      use-code-as-default-message: true
    exception-handling:
      enabled: true
    paging-resolver:
      enabled: true
    cors:
      enabled: false
      path-pattern: "/**"
      allowed-origins: []
      allowed-methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
      allowed-headers: ["*"]
      exposed-headers: ["X-Trace-Id", "X-Correlation-Id"]
      allow-credentials: true
      max-age: 3600
    security-headers:
      enabled: true
      content-type-options: "nosniff"
      frame-options: "DENY"
      referrer-policy: "strict-origin-when-cross-origin"
      xss-protection: "0"
    logging:
      enabled: true
      slow-request-threshold-ms: 1000
      include-headers: true
      mask-headers:
        - authorization
        - cookie
        - x-api-key
      exclude-paths:
        - /actuator/**
        - /favicon.ico

  # 2. Distributed Cache & Redis (platform-cache-core & platform-cache-redis)
  cache:
    enabled: true
    key-prefix: "authory"
    default-ttl: 15m
    null-ttl: 1m
    lock-wait: 5s
    lock-lease: 0s # Activates Redisson watchdog auto-renewal
    jitter-ratio: 0.10 # ±10% jitter to prevent cache stampedes / avalanche
    fail-open: true # Fallback smoothly if Redis is temporarily unreachable
    metrics-enabled: true
    redis:
      mode: single
      address: ${REDIS_URL:redis://localhost:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      connection-pool-size: 64
      connection-minimum-idle-size: 16
      connect-timeout: 5s
      timeout: 3s
      retry-attempts: 3
      retry-interval: 1s

  # 3. Data Core & JPA (platform-data-core & platform-data-jpa)
  data:
    audit-enabled: true
    soft-delete-enabled: false
    jpa:
      enabled: true
      auditing-enabled: false # Custom Auditing handled by Authory service entities
      default-auditor: "SYSTEM"

  # 4. Mutation Replay Protection (platform-idempotency-core)
  idempotency:
    enabled: true
    header-name: "Idempotency-Key"
    ttl: 24h
    lock-wait-time: 2s
    lock-lease-time: 30s
    enforce-payload-match: true
    evict-on-failure: true
    applicable-methods:
      - POST
      - PUT
      - PATCH
    excluded-path-prefixes:
      - /actuator
      - /favicon.ico
      - /v3/api-docs
      - /swagger-ui

  # 5. Distributed Sliding Window Rate Limiting (platform-ratelimit-core & platform-ratelimit-redis)
  ratelimit:
    enabled: true
    filter-enabled: true
    key-prefix: "authory:ratelimit:"
    rules:
      - path-pattern: "/api/v1/auth/login"
        methods: ["POST"]
        limit: 10
        window: 1m
        key-strategy: IP
        headers: true
        message: "Too many login attempts. Please try again after 1 minute."
      - path-pattern: "/api/v1/auth/register"
        methods: ["POST"]
        limit: 10
        window: 1m
        key-strategy: IP
        headers: true
        message: "Too many registration requests. Please try again after 1 minute."
      - path-pattern: "/api/v1/auth/mfa/verify"
        methods: ["POST"]
        limit: 10
        window: 1m
        key-strategy: IP
        headers: true
        message: "Too many MFA verification attempts. Please try again after 1 minute."
      - path-pattern: "/api/v1/auth/forgot-password"
        methods: ["POST"]
        limit: 5
        window: 1m
        key-strategy: IP
        headers: true
        message: "Too many password reset requests. Please try again after 1 minute."
      - path-pattern: "/api/v1/auth/reset-password"
        methods: ["POST"]
        limit: 5
        window: 1m
        key-strategy: IP
        headers: true
        message: "Too many password reset attempts. Please try again after 1 minute."

  # 6. Distributed Tracing & W3C Context (platform-tracing-core)
  tracing:
    enabled: true
    correlation-header: "X-Correlation-Id"
    trace-response-headers: true

  # 7. Pure Security Port & Declarative Annotations (platform-security-core)
  security:
    enabled: true
    aop-enabled: true # Enables @RequireRole and @RequirePermission aspect evaluation
    web-resolver-enabled: true # Resolves @CurrentUser AuthenticatedUser in controllers
    exception-handler-enabled: false # Handled via GlobalApiExceptionHandler to return ApiErrorResponse

  # 8. OpenAPI 3 Contracts & Swagger UI (platform-openapi-core)
  openapi:
    enabled: true
    title: Authory Service API
    description: Enterprise Authorization & Identity Management Microservice - RBAC, ABAC, Multi-tenancy, and JWT Authentication.
    version: v1.0.0
    contact:
      name: Authory Service Team
      email: support@linhtn.com
      url: https://authory.internal
    servers:
      - url: /
        description: Default Server Root
    security:
      jwt-enabled: true
      jwt-scheme-name: "bearerAuth"
      api-key-enabled: false
      tenant-header-enabled: false
    standard-responses-enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

authory-server-impl:
  whitelist-routes:
    - /api/v1/public/**
    - /api/v1/auth/login
    - /api/v1/auth/register
    - /api/v1/auth/mfa/verify
    - /api/v1/auth/forgot-password
    - /api/v1/auth/reset-password
    - /api/v1/auth/refresh-token
    - /api/v1/auth/principal/api-key
    - /api/v1/auth/principal/client
    - /api/v1/auth/jwks.json
    - /.well-known/jwks.json
    - /actuator/**
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html
  swagger-routes:
    - /swagger-ui.html
    - /swagger-ui/**
    - /v3/api-docs/**
  jwt:
    secret-key: ${JWT_SECRET_KEY:q8N2f2j+V2xYcD1N8b9J7E3lH1x+YkL4Bf7Zq2VxG+Q=}
    access-expiration: ${JWT_ACCESS_EXPIRATION:3600000} # 1h (ms)
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days (ms)
