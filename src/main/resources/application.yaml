server:
  port: ${PORT:8600}
  shutdown: graceful

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: authory-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authory}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maxLifetime: 1800000
      connectionTimeout: 30000
      minimumIdle: 5
      idleTimeout: 600000
      maximumPoolSize: 20
      leakDetectionThreshold: 5000
      pool-name: AuthoryHikariPool
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    schemas: public, auth, partner, organization, rbac, abac
    locations: classpath:db/migration
  cache:
    type: simple
    cache-names:
      - user-authorities
      - partner-authorities
      - user-principals
      - partner-principals
      - abac-attributes
      - user-attributes

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Enterprise Platform Configurations (be-platform)
platform:
  # 1. Web Core & i18n
  web:
    i18n:
      enabled: true
      default-locale: en
      supported-locales:
        - en
        - vi
      base-names:
        - classpath:i18n/messages
        - classpath:messages
      cache-seconds: 3600
      encoding: UTF-8
      fallback-to-system-locale: false
      use-code-as-default-message: true
    exception-handling:
      enabled: true
    paging-resolver:
      enabled: true
      default-page: 0
      default-page-size: 20
      max-page-size: 100
    security-headers:
      enabled: true
    logging:
      enabled: false

  # 2. Distributed Cache & Redis (cache-core & cache-redis)
  cache:
    enabled: true
    key-prefix: "authory"
    default-ttl: 15m
    null-ttl: 1m
    lock-wait: 5s
    lock-lease: 0s # Activates Redisson watchdog auto-renewal
    jitter-ratio: 0.10 # ±10% jitter to prevent cache stampedes / avalanche
    fail-open: true # Fallback smoothly if Redis is temporarily unreachable
    metrics-enabled: true
    redis:
      mode: single
      address: ${REDIS_URL:redis://localhost:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      connection-pool-size: 64
      connection-minimum-idle-size: 16
      connect-timeout: 5s
      timeout: 3s
      retry-attempts: 3
      retry-interval: 1s

  # 3. Data Core & JPA (data-core & data-jpa)
  data:
    jpa:
      enabled: true
      auditing-enabled: true
      default-auditor: "SYSTEM"

  # 4. Mutation Replay Protection (idempotency-core)
  idempotency:
    enabled: true
    header-name: "Idempotency-Key"
    ttl: 24h
    lock-wait-time: 2s
    lock-lease-time: 30s
    enforce-payload-match: true
    evict-on-failure: true

  # 5. Distributed Sliding Window Rate Limiting (platform: ratelimit-core & ratelimit-redis)
  ratelimit:
    enabled: true
    filter-enabled: true
    key-prefix: "authory:ratelimit:"
    rules:
      - path-pattern: "/api/v1/auth/login"
        methods: [ "POST" ]
        limit: 10
        window: 1m
        key-strategy: IP
        headers: true
        message: "Too many login attempts. Please try again after 1 minute."
      - path-pattern: "/api/v1/auth/register"
        methods: [ "POST" ]
        limit: 10
        window: 1m
        key-strategy: IP
        headers: true
        message: "Too many registration requests. Please try again after 1 minute."
      - path-pattern: "/api/v1/auth/mfa/verify"
        methods: [ "POST" ]
        limit: 10
        window: 1m
        key-strategy: IP
        headers: true
        message: "Too many MFA verification attempts. Please try again after 1 minute."
      - path-pattern: "/api/v1/auth/forgot-password"
        methods: [ "POST" ]
        limit: 5
        window: 1m
        key-strategy: IP
        headers: true
        message: "Too many password reset requests. Please try again after 1 minute."
      - path-pattern: "/api/v1/auth/reset-password"
        methods: [ "POST" ]
        limit: 5
        window: 1m
        key-strategy: IP
        headers: true
        message: "Too many password reset attempts. Please try again after 1 minute."

  # 6. OpenAPI 3 Contracts (openapi-core)
  openapi:
    enabled: true
    title: Authory Service API
    description: Enterprise Authorization & Identity Management Microservice - RBAC, ABAC, Multi-tenancy, and JWT Authentication.
    version: v1.0.0
    contact:
      name: Authory Service Team
      email: support@linhtn.com
    servers:
      - url: /
        description: Default Server Root
    security:
      jwt-enabled: true
      api-key-enabled: false
    standard-responses-enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

authory-server-impl:
  whitelist-routes:
    - /api/v1/public/**
    - /api/v1/auth/login
    - /api/v1/auth/register
    - /api/v1/auth/mfa/verify
    - /api/v1/auth/forgot-password
    - /api/v1/auth/reset-password
    - /api/v1/auth/refresh-token
    - /api/v1/auth/principal
    - /api/v1/auth/principal/partner
    - /api/v1/auth/jwks.json
    - /.well-known/jwks.json
    - /actuator/**
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html
  swagger-routes:
    - /swagger-ui.html
    - /swagger-ui/**
    - /v3/api-docs/**
  jwt:
    secret-key: ${JWT_SECRET_KEY:q8N2f2j+V2xYcD1N8b9J7E3lH1x+YkL4Bf7Zq2VxG+Q=}
    access-expiration: ${JWT_ACCESS_EXPIRATION:3600000} # 1h (ms)
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days (ms)
