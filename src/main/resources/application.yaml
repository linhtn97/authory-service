server:
  port: 8600

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: authory-service
  datasource:
    hikari:
      maxLifetime: 1800000
      connectionTimeout: 30000
      minimumIdle: 5
      idleTimeout: 600000
      maximumPoolSize: 20
    driver-class-name: org.postgresql.Driver
    password: postgres
    username: postgres
    url: jdbc:postgresql://localhost:5432/authory
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
  #    show-sql: true
  #  session:
  #    jdbc:
  #      initialize-schema: always
  sql:
    init:
      encoding: UTF-8

authory-server-impl:
  whitelist-routes:
    - /api/v1/public/**
    - /api/v1/auth/login
    - /api/v1/auth/register
    - /api/v1/auth/refresh-token
  swagger-routes:
    - /swagger-ui.html
    - /swagger-ui/**
    - /v3/api-docs/**
  jwt:
    secret-key: q8N2f2j+V2xYcD1N8b9J7E3lH1x+YkL4Bf7Zq2VxG+Q=
    access-expiration: 3600000        # 1h (ms)
    refresh-expiration: 604800000     # 7 days (ms)