components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Stateless RS256/HS256 JWT issued via /api/v1/auth/login or /api/v1/auth/mfa/verify. Supply as `Bearer <token>`."
    ClientIdAuth:
      type: apiKey
      in: header
      name: Client-Id
      description: B2B Partner Client ID header.
    ClientKeyAuth:
      type: apiKey
      in: header
      name: Client-Key
      description: B2B Partner Secret Key header.
  schemas:
    ApiErrorResponse:
      type: object
      description: Standardized REST API error payload (aligned with RFC 7807 problem details) from be-platform:shared-kernel.
      properties:
        status:
          type: integer
          example: 400
          description: HTTP status code
        errorCode:
          type: string
          example: METHOD_ARGUMENT_NOT_VALID
          description: Machine-readable error code
        errorMessage:
          type: string
          example: Validation failed for one or more fields
          description: Localized human-readable error message
        errorDetails:
          type: object
          nullable: true
          additionalProperties: true
          example:
            email: Email must be a valid email address
          description: Detailed validation field errors or auxiliary error context
        timestamp:
          type: string
          example: "2026-11-26 20:50:00"
          description: Timestamp formatted as yyyy-MM-dd HH:mm:ss
        path:
          type: string
          example: /api/v1/users
          description: Target request URI
        traceId:
          type: string
          example: 11111111-2222-3333-4444-555555555555
          description: Distributed tracing / Correlation ID for observability tracking
    PagingRequest:
      type: object
      properties:
        page:
          type: integer
          default: 0
          minimum: 0
          description: Zero-based page index
        pageSize:
          type: integer
          default: 20
          minimum: 1
          maximum: 500
          description: Number of records per page
        quickFilter:
          type: string
          description: Universal full-text search term across searchable fields
        orders:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: createdAt
              sort:
                type: string
                enum:
                  - asc
                  - desc
                default: asc
        filters:
          type: array
          description: Dynamic criterion filter conditions
          items:
            type: object
            properties:
              field:
                type: string
                example: status
              operator:
                type: string
                example: EQUALS
              value:
                type: string
                example: ACTIVE
    PagingResponseMeta:
      type: object
      properties:
        page:
          type: integer
          example: 0
        pageSize:
          type: integer
          example: 20
        totalElements:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 5
    RegisterRequest:
      type: object
      required:
        - username
        - password
        - email
      properties:
        username:
          type: string
          example: johndoe
        password:
          type: string
          format: password
          example: "Password123!"
        email:
          type: string
          format: email
          example: "johndoe@example.com"
        phone:
          type: string
          example: "+1234567890"
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
    AuthLoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
          example: "Password123!"
        deviceName:
          type: string
          example: Chrome on macOS
    AuthLoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: Stateless RS256 JWT access token
        refreshToken:
          type: string
          description: Opaque or signed refresh token for rotation
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          example: 3600
        mfaRequired:
          type: boolean
          example: false
        tempToken:
          type: string
          description: Pre-auth token required when MFA is enforced
    MfaVerifyRequest:
      type: object
      required:
        - tempToken
        - totpCode
      properties:
        tempToken:
          type: string
          description: Temporary pre-auth JWT
        totpCode:
          type: string
          example: "123456"
          description: 6-digit RFC 6238 TOTP code
    MfaSetupResponse:
      type: object
      properties:
        secret:
          type: string
          example: JBSWY3DPEHPK3PXP
        qrCodeUri:
          type: string
          example: "otpauth://totp/Authory:admin?secret=JBSWY3DPEHPK3PXP&issuer=Authory"
        qrCodeBase64:
          type: string
          description: Data URI base64 PNG
    MfaEnableRequest:
      type: object
      required:
        - totpCode
      properties:
        totpCode:
          type: string
          example: "123456"
    MfaDisableRequest:
      type: object
      required:
        - password
        - totpCode
      properties:
        password:
          type: string
          format: password
        totpCode:
          type: string
          example: "123456"
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          example: reset-token-uuid-or-jwt
        newPassword:
          type: string
          format: password
          example: "NewSecret123!"
    Principal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          example: admin
        type:
          type: string
          enum:
            - USER
            - PARTNER
          example: USER
        roles:
          type: array
          items:
            type: string
          example:
            - ROLE_SUPER_ADMIN
        permissions:
          type: array
          items:
            type: string
          example:
            - "USER:READ"
            - "USER:WRITE"
        groups:
          type: array
          items:
            type: string
          example:
            - IT_DEPT
    SessionGetResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ipAddress:
          type: string
          example: 192.168.1.1
        userAgent:
          type: string
          example: Mozilla/5.0...
        deviceName:
          type: string
          example: Firefox on Linux
        createdAt:
          type: string
          format: date-time
        expiredAt:
          type: string
          format: date-time
        current:
          type: boolean
          example: true
    PolicyEvaluationRequest:
      type: object
      required:
        - action
        - resourceType
      properties:
        userId:
          type: string
          format: uuid
        action:
          type: string
          example: READ
        resourceType:
          type: string
          example: FINANCIAL_REPORT
        resourceAttributes:
          type: object
          additionalProperties: true
          example:
            classification: CONFIDENTIAL
            departmentId: 11111111-2222-3333-4444-555555555555
        environmentAttributes:
          type: object
          additionalProperties: true
          example:
            ipAddress: 10.0.0.1
            requestTime: "14:30:00"
    PolicyEvaluationResponse:
      type: object
      properties:
        allowed:
          type: boolean
          example: true
        decision:
          type: string
          example: PERMIT
        reason:
          type: string
          example: Access permitted by policy Rule-1
        evaluatedSubjectAttributes:
          type: object
          additionalProperties: true
        matchedRules:
          type: array
          items:
            type: string
          example:
            - RULE_IP_ALLOWLIST
            - RULE_DEPT_MATCH
    DashboardGetMetricsResponse:
      type: object
      properties:
        totalUsers:
          type: integer
          example: 1250
        activeUsers:
          type: integer
          example: 1180
        totalRoles:
          type: integer
          example: 15
        totalPermissions:
          type: integer
          example: 120
        activeSessions:
          type: integer
          example: 450
        totalPartners:
          type: integer
          example: 12
    SystemActivityGetRecentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          example: USER_CREATED
        entityName:
