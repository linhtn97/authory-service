openapi: 3.0.3
info:
  title: Authory Service API
  description: "Enterprise Identity, Authentication & Fine-Grained Authorization Microservice. Conforms strictly to RFC 9110, RFC 7517 (JWKS), RFC 6238 (TOTP MFA), and RFC 6750 (OAuth 2.0 Bearer Token). Standardized on be-platform shared-kernel pagination (PagingRequest, PagingResponse) and error responses (ApiErrorResponse)."
  version: v1.0.0
  contact:
    name: Authory Service Team
    email: "support@linhtn.com"
servers:
  - url: "http://localhost:8600"
    description: Local Development Server
  - url: /
    description: Current Host Root
tags:
  - name: "Authentication & Sessions"
    description: "User login, registration, MFA/2FA, password reset, and principal resolution"
  - name: "Authentication & JWKS"
    description: JSON Web Key Set (RFC 7517) public key discovery for token verification
  - name: Active Device Sessions
    description: "Device tracking, active refresh tokens, and remote session termination"
  - name: Partner Management
    description: "B2B multi-tenant partner registration, credential generation, and tenant isolation"
  - name: User Management
    description: "User identity lifecycle, account management, pagination, and account unlock"
  - name: RBAC - Roles
    description: Security roles management with hierarchical authority associations
  - name: RBAC - Role Permissions
    description: Binding and revoking permissions to/from security roles
  - name: RBAC - Permissions
    description: Granular permissions catalog across system actions and resources
  - name: RBAC - Groups
    description: User group categorization and collective authority administration
  - name: RBAC - Group Permissions
    description: Binding and revoking permissions to/from user groups
  - name: RBAC - Resources
    description: Secured resource definitions and URI path patterns
  - name: RBAC - Resource Permissions
    description: Binding permissions to specific protected resources
  - name: RBAC - User Roles
    description: Assigning and querying security roles on users
  - name: RBAC - User Groups
    description: Assigning and querying user group memberships
  - name: RBAC - User Resources
    description: Direct resource assignments and authorizations on users
  - name: ABAC - Attributes
    description: "Dynamic subject, resource, and environment attribute schema definitions"
  - name: ABAC - User Attributes
    description: Assigning and querying custom attribute values on users
  - name: ABAC - Policy Evaluation
    description: Dynamic Policy Decision Point (PDP) evaluating SpEL rules over attributes
  - name: Organization - Companies
    description: Root corporate entity management in enterprise multi-level hierarchy
  - name: Organization - Branches
    description: Regional branch office management
  - name: Organization - Centers
    description: Operational center management
  - name: Organization - Divisions
    description: Corporate business division management
  - name: Organization - Departments
    description: Departmental unit management
  - name: Organization - Positions
    description: Job position and title classification
  - name: Dashboard Overview
    description: "System-wide metrics, active session counts, and audit activity summaries"
paths:
  /api/v1/auth/register:
    post:
      tags:
        - "Authentication & Sessions"
      summary: Register new user account
      description: Creates a new user profile with encoded password and default state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        201:
          description: User successfully registered
        400:
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        409:
          description: Conflict / Optimistic Lock Failure or Duplicate Unique Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/auth/login:
    post:
      tags:
        - "Authentication & Sessions"
      summary: User login with credentials
      description: "Authenticates user via username and password. Issues stateless JWT access & refresh tokens or temporary token if MFA is enabled."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        200:
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
        400:
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        423:
          description: Account locked due to consecutive failed attempts
  /api/v1/auth/mfa/verify:
    post:
      tags:
        - "Authentication & Sessions"
      summary: Verify 2FA TOTP code
      description: Completes 2-step authentication using the temporary JWT and a 6-digit TOTP code (RFC 6238).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerifyRequest"
      responses:
        200:
          description: "MFA verified, tokens issued"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
        400:
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/auth/mfa/setup:
    post:
      tags:
        - "Authentication & Sessions"
      summary: Initiate MFA / 2FA setup
      description: Generates a new RFC 6238 TOTP shared secret and QR code URI for authenticator apps.
      security:
        - BearerAuth: []
      responses:
        200:
          description: MFA setup initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaSetupResponse"
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/auth/mfa/enable:
    post:
      tags:
        - "Authentication & Sessions"
      summary: Verify initial TOTP and enable 2FA
      description: Verifies the first TOTP code generated by user to confirm setup and activate MFA.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaEnableRequest"
      responses:
        200:
          description: MFA enabled successfully
        400:
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/auth/mfa/disable:
    post:
      tags:
        - "Authentication & Sessions"
      summary: Disable 2FA
      description: Disables MFA after verifying user password and current TOTP code.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaDisableRequest"
      responses:
        200:
          description: MFA disabled successfully
        400:
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/auth/forgot-password:
    post:
      tags:
        - "Authentication & Sessions"
      summary: Request password reset
      description: Sends a password reset email containing a time-limited token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        200:
          description: Password reset email sent if account exists
  /api/v1/auth/reset-password:
    post:
      tags:
        - "Authentication & Sessions"
      summary: Reset password using token
      description: Updates account password with the provided reset token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        200:
          description: Password successfully reset
        400:
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/auth/logout:
    get:
      tags:
        - "Authentication & Sessions"
      summary: Logout user
      description: Revokes the current JWT access token via Redis/in-memory blacklist and invalidates the session.
      security:
        - BearerAuth: []
      responses:
        200:
          description: User successfully logged out
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/auth/refresh-token:
    get:
      tags:
        - "Authentication & Sessions"
      summary: Refresh access token
      description: Issues a new JWT access token using the unrevoked refresh token.
      parameters:
        - name: refreshToken
          in: header
          required: false
          schema:
            type: string
      responses:
        200:
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/auth/principal:
    get:
      tags:
        - "Authentication & Sessions"
      summary: Resolve user principal by token
      description: "Resolves current caller identity, assigned roles, permissions, and groups."
      security:
        - BearerAuth: []
      responses:
        200:
          description: Caller principal resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/auth/principal/user:
    get:
      tags:
        - "Authentication & Sessions"
      summary: Resolve user principal by ID
      description: Internal query to resolve user authorities by UUID.
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: User principal resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        404:
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/auth/principal/partner:
    get:
      tags:
        - "Authentication & Sessions"
      summary: Resolve partner principal via B2B API keys
      description: Authenticates external partner via Client-Id and Client-Key headers.
      security:
        - ClientIdAuth: []
          ClientKeyAuth: []
      responses:
        200:
          description: Partner principal resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/auth/jwks.json:
    get:
      tags:
        - "Authentication & JWKS"
      summary: Get JSON Web Key Set (RFC 7517)
      description: Public key set in JWKS format for verifying RS256 signatures.
      responses:
        200:
          description: JWKS document
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        kty:
                          type: string
                          example: RSA
                        use:
                          type: string
                          example: sig
                        alg:
                          type: string
                          example: RS256
                        kid:
                          type: string
                          example: authory-key-1
                        n:
                          type: string
                        e:
                          type: string
                          example: AQAB
  /.well-known/jwks.json:
    get:
      tags:
        - "Authentication & JWKS"
      summary: RFC 7517 Well-Known JWKS Endpoint
      description: Standard OIDC well-known JWKS discovery endpoint.
      responses:
        200:
          description: JWKS document
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
  /api/v1/auth/sessions:
    get:
      tags:
        - Active Device Sessions
      summary: List all active device sessions
      description: Retrieves all unrevoked device sessions and refresh tokens for current user.
      security:
        - BearerAuth: []
      responses:
        200:
          description: Active sessions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionGetResponse"
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/auth/sessions/{id}:
    delete:
      tags:
        - Active Device Sessions
      summary: Revoke specific device session
      description: Remotely terminates and invalidates a specific device session.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Session UUID
      responses:
        204:
          description: Session successfully revoked
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        404:
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/auth/sessions/revoke-all:
    post:
      tags:
        - Active Device Sessions
      summary: Revoke all other active device sessions
      description: Terminates all active sessions for the user across all other devices.
      security:
        - BearerAuth: []
      responses:
        204:
          description: All other sessions revoked
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/dashboard/metrics:
    get:
      tags:
        - Dashboard Overview
      summary: Get system metrics
      description: "Aggregates total user count, role count, active sessions, and tenant metrics."
      security:
        - BearerAuth: []
      responses:
        200:
          description: System metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardGetMetricsResponse"
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/dashboard/recent-activities:
    get:
      tags:
        - Dashboard Overview
      summary: Get recent system activities
      description: Retrieves the 20 most recent system audit log entries.
      security:
        - BearerAuth: []
      responses:
        200:
          description: Recent activity logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemActivityGetRecentResponse"
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/abac/evaluate:
    post:
      tags:
        - ABAC - Policy Evaluation
      summary: Evaluate ABAC access policy (PDP)
      description: Dynamic Policy Decision Point (PDP) evaluating SpEL rules over attributes.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyEvaluationRequest"
      responses:
        200:
          description: Policy evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyEvaluationResponse"
        400:
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/users:
    get:
      tags:
        - User Management
      summary: Query users with query parameters
      description: Retrieves a paginated list of users using simple URL query parameters.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: sortBy
          in: query
          schema:
            type: string
        - name: sortDir
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: search
          in: query
          schema:
            type: string
      responses:
        200:
          description: Paginated users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPageResponse"
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    post:
      tags:
        - User Management
      summary: Create user
      description: Persists a new user record and triggers domain events.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        201:
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCreateResponse"
        400:
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        409:
          description: Conflict / Optimistic Lock Failure or Duplicate Unique Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/users/get-page:
    post:
      tags:
        - User Management
      summary: Dynamic query pagination (POST)
      description: Advanced criteria pagination for users supporting complex multi-column sorting and filtering.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagingRequest"
      responses:
        200:
          description: Paginated users matching criteria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPageResponse"
        400:
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/users/{id}:
    get:
      tags:
        - User Management
      summary: Get user by ID
      description: Retrieves full details for a specific user by UUID.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User UUID
      responses:
        200:
          description: User details found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGetResponse"
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        404:
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    put:
      tags:
        - User Management
      summary: Update user details
      description: Updates user fields. Enforces JPA optimistic locking through version verification.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        200:
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserUpdateResponse"
        400:
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        404:
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        409:
          description: Conflict / Optimistic Lock Failure or Duplicate Unique Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    delete:
      tags:
        - User Management
      summary: Delete user
      description: Removes a user record.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User UUID
      responses:
        204:
          description: User successfully deleted
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        404:
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/partners:
    get:
      tags:
        - Partner Management
      summary: Query partners with query parameters
      description: Retrieves a paginated list of partners using simple URL query parameters.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: sortBy
          in: query
          schema:
            type: string
        - name: sortDir
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: search
          in: query
          schema:
            type: string
      responses:
        200:
          description: Paginated partners list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerPageResponse"
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    post:
      tags:
        - Partner Management
      summary: Create partner
      description: Persists a new partner record and triggers domain events.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerCreateRequest"
      responses:
        201:
          description: Partner created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerCreateResponse"
        400:
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        409:
          description: Conflict / Optimistic Lock Failure or Duplicate Unique Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/partners/get-page:
    post:
      tags:
        - Partner Management
      summary: Dynamic query pagination (POST)
      description: Advanced criteria pagination for partners supporting complex multi-column sorting and filtering.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagingRequest"
      responses:
        200:
          description: Paginated partners matching criteria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerPageResponse"
        400:
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        401:
          description: Unauthorized / Missing or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/partners/{id}:
    get:
      tags:
        - Partner Management
      summary: Get partner by ID
      description: Retrieves full details for a specific partner by UUID.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Partner UUID
      responses:
        200:
          description: Partner details found
          content:
            application/json:
              schema:
